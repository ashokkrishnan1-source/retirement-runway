# Publishes the app to GitHub Pages on every push to main.
# The rules check runs first: if any of its checks fail, nothing is deployed.
name: Check and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rules check (hand-worked cases)
        run: node tests/check-rules.js
      - name: Prism engine check (hand-worked cases)
        run: node tests/check-prism.js
      - name: Shared code is in sync across tools
        run: node tools/sync-vault.js --check
      - name: Build the standalone page
        run: node tools/build-pages.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: check-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
